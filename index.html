<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Earth Moon Orbit Model</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="universe">
        <div class="stars" id="stars"></div>
        
        <div class="solar-system">
            <div class="sun">
                <div class="sun-glow"></div>
            </div>

            <div class="earth-orbit">
                <div class="earth-system">
                    <div class="earth">
                        <div class="earth-shadow"></div>
                        <div class="earth-detail"></div>
                    </div>
                    
                    <div class="moon-orbit">
                        <div class="moon"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <h1>Solar System Model</h1>
            <div class="control-group">
                <button id="toggle-anim" class="btn">Pause Animation</button>
                <div class="speed-control">
                    <label for="speed-slider">Speed</label>
                    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
